# ==============================================================================
# NightGuard Render Blueprint Specification
# Deploys Full-Stack Web App, API + WebSockets, Worker, PostgreSQL & Redis
# ==============================================================================

databases:
  - name: nightguard-postgres
    databaseName: nightguard
    user: nightguard
    plan: starter

services:
  # ----------------------------------------------------------------------------
  # 1. API Service (REST + WebSockets)
  # ----------------------------------------------------------------------------
  - type: web
    name: nightguard-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run generate --workspace=@nightguard/database && npm run build --workspaces
    startCommand: npm run migrate --workspace=@nightguard/database && npm run start --workspace=@nightguard/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nightguard-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_URL
        fromService:
          type: web
          name: nightguard-web
          property: url

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Service (Next.js 14)
  # ----------------------------------------------------------------------------
  - type: web
    name: nightguard-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build --workspace=@nightguard/shared && npm run build --workspace=@nightguard/web
    startCommand: npm run start --workspace=@nightguard/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nightguard-api
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: nightguard-api
          property: url

  # ----------------------------------------------------------------------------
  # 3. Persistent Background Scheduler & Policy Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: nightguard-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build --workspaces
    startCommand: npm run start --workspace=@nightguard/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nightguard-postgres
          property: connectionString
